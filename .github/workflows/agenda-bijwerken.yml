name: Werk wedstrijdagenda bij

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Benodigdheden installeren
        run: pip install -r requirements.txt

      - name: Kalender maken
        run: python scripts/maak_agenda.py

      - name: Alleen echte wijzigingen opslaan
        run: |
          if git diff --quiet -- scp-1.ics; then
            echo "Geen wijziging in de agenda."
            exit 0
          fi
          git config user.name "VV SCP Agenda Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scp-1.ics
          git commit -m "Werk wedstrijdagenda SCP 1 bij"
          git push
