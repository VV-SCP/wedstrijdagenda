name: Werk alle wedstrijdagenda's bij

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-calendars:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Benodigdheden installeren
        run: pip install -r requirements.txt

      - name: Foutieve oude agenda's verwijderen
        run: |
          rm -f "sjo-scp-dsz-o13-ewijk-1.ics"
          rm -f "sjo-scp-dsz-o14-sc-woezik-2.ics"
          rm -f "sjo-scp-dsz-o15-blauw-wit-1.ics"

      - name: Alle agenda's maken
        run: python maak_agenda.py

      - name: Controleer resterende foutbestanden
        run: |
          if find . -maxdepth 1 -type f -name 'sjo-scp-dsz-*-*-*.ics' | grep -q .; then
            echo "Let op: mogelijk foutieve agenda's gevonden:"
            find . -maxdepth 1 -type f -name 'sjo-scp-dsz-*-*-*.ics'
          else
            echo "Geen bekende foutieve agenda's aangetroffen."
          fi

      - name: Alle wijzigingen en verwijderingen opslaan
        run: |
          git config user.name "VV SCP Agenda Bot"
          git config user.email "actions@users.noreply.github.com"

          git add -A

          echo "Git-status voor opslaan:"
          git status --short

          if git diff --cached --quiet; then
            echo "Geen wijzigingen in de agenda's."
            exit 0
          fi

          git commit -m "Werk wedstrijdagenda's VV SCP bij"
          git push
